name: Executar Automacao Amazon

on:
  schedule:
    # Executa todos os dias às 09:00 UTC (ajuste conforme necessário)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite rodar o script manualmente pelo GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Script de Automação
        run: python seu_script.py

      - name: Salvar alterações no repositório (opcional)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto: Atualização de produtos" || exit 0
          git push
