<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ofertas da Amazon</title>
  <style>
    .grid { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 200px; text-align: center; }
    .card img { max-width: 100%; height: auto; }
    .btn { display: inline-block; background: #ffa41c; color: #000; padding: 8px 12px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Melhores Ofertas da Amazon</h1>
  <div id="produtos" class="grid"></div>

  <script>
    fetch('produtos.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('produtos');
        container.innerHTML = data.map(p => `
          <div class="card">
            <img src="${p.imagem}" alt="${p.titulo}">
            <h3>${p.titulo}</h3>
            <p><strong>${p.preco}</strong></p>
            <a class="btn" href="${p.link}" target="_blank">Ver na Amazon</a>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
